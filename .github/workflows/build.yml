name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip project if repo contains a zip
        run: |
          for z in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
            echo "Unzipping $z"
            unzip -oq "$z" -d "$(dirname "$z")"
          done

      - name: Find Android project
        id: root
        run: |
          F=$(find . -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::No settings.gradle(.kts) found. Files in repo:"
            find . -maxdepth 4 -not -path './.git/*' | head -n 80
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
          echo "Android project: $(dirname "$F")"

      - name: Patch Java 17 target (fixes JVM-target mismatch)
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("app/build.gradle.kts")
          if not p.exists():
              print("app/build.gradle.kts not found, skipping")
              raise SystemExit
          t = p.read_text()
          if "compileOptions" in t:
              print("Already patched")
              raise SystemExit
          patch = (
              "    compileOptions {\n"
              "        sourceCompatibility = JavaVersion.VERSION_17\n"
              "        targetCompatibility = JavaVersion.VERSION_17\n"
              "    }\n"
              "    kotlinOptions {\n"
              "        jvmTarget = \"17\"\n"
              "    }\n"
          )
          t2 = re.sub(r"(\n\s*buildFeatures)", "\n" + patch + r"\1", t, count=1)
          if t2 == t:
              t2 = re.sub(r"(android\s*\{)", r"\1\n" + patch, t, count=1)
          p.write_text(t2)
          print("Patched app/build.gradle.kts")
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set +e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --console=plain --no-daemon > build.log 2>&1
          else
            gradle assembleDebug --console=plain --no-daemon > build.log 2>&1
          fi
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::error title=Build failed::$(grep -E -A8 'What went wrong|^e: |error:' build.log | head -n 25 | tr '\n' ' ')"
            tail -n 60 build.log
          fi
          exit $CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoForge-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
